name: unplayd
services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: unplayd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via Infisical or environment}
      USER_API_DB_PASSWORD: ${USER_API_DB_PASSWORD:?Set USER_API_DB_PASSWORD via Infisical or environment}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD via Infisical or environment}
    ports:
      - "127.0.0.1:8447:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unplayd"]
      interval: 5s
      timeout: 3s
      retries: 20
  user-api:
    build: apps/user-api
    environment:
      PORT: "8445"
      DATABASE_URL: jdbc:postgresql://postgres:5432/unplayd?currentSchema=user_data
      DATABASE_USER: user_api
      DATABASE_PASSWORD: ${USER_API_DB_PASSWORD:?Set USER_API_DB_PASSWORD via Infisical or environment}
      CLERK_ISSUER: ${CLERK_ISSUER:?Set CLERK_ISSUER via Infisical or environment}
      CLERK_AUTHORIZED_PARTY: ${CLERK_AUTHORIZED_PARTY:-http://localhost:8444}
    ports:
      - "127.0.0.1:8445:8445"
    depends_on:
      postgres: { condition: service_healthy }
  catalog-api:
    build: apps/catalog-api
    environment:
      PORT: "8446"
      DATABASE_URL: postgresql://postgres:5432/unplayd?search_path=catalog&sslmode=disable
      DATABASE_USER: catalog
      DATABASE_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD via Infisical or environment}
      CATALOG_SERVICE_TOKEN: ${CATALOG_SERVICE_TOKEN:?Set CATALOG_SERVICE_TOKEN via Infisical or environment}
    ports:
      - "127.0.0.1:8446:8446"
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8444:8444"
    environment:
      NUXT_USER_API_URL: http://user-api:8445
      NUXT_CATALOG_API_URL: http://catalog-api:8446
      NUXT_CATALOG_SERVICE_TOKEN: ${CATALOG_SERVICE_TOKEN:?Set CATALOG_SERVICE_TOKEN via Infisical or environment}
      NUXT_APP_ORIGIN: ${NUXT_APP_ORIGIN:-http://localhost:8444}
      NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NUXT_CLERK_SECRET_KEY: ${NUXT_CLERK_SECRET_KEY:-}
    depends_on: [user-api, catalog-api]
volumes:
  postgres-data:
