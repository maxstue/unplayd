packages:
  - apps/*
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
# The Vite+ alias exposes its own package version instead of Vite's version.
# Only these tested consumers may accept this exact alias version.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    "vitest@5.1.0>vite": "1.5.0"
    "vite-plugin-checker@0.14.5>vite": "1.5.0"
    "@nuxt/devtools-kit@3.4.4>vite": "1.5.0"
    "@nuxt/devtools-kit@3.4.3>vite": "1.5.0"
    "@nuxt/devtools@3.4.4>vite": "1.5.0"
    "vite-hot-client@2.2.0>vite": "1.5.0"
    "vite-dev-rpc@2.0.0>vite": "1.5.0"
    "@vitejs/plugin-vue@6.0.10>vite": "1.5.0"
    "@vitejs/plugin-vue-jsx@5.1.6>vite": "1.5.0"
    "vite-plugin-vue-tracer@1.6.0>vite": "1.5.0"
    "vite-plugin-inspect@11.4.1>vite": "1.5.0"
    "@nuxt/vite-server@4.6.4>vite": "1.5.0"
minimumReleaseAgeExclude:
  - "@clerk/nuxt@3.1.21"
  - "@clerk/shared@4.44.0"
  - "@clerk/vue@2.5.18"
  - "@voidzero-dev/vite-plus-core@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.5.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.5.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.5.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.5.0"
  - vite-plus@1.5.0
