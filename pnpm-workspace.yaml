packages:
  - apps/*
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
overrides:
  vite@*: "catalog:"
# The alias exposes package version 1.2.0, but contains Vite 8.3.4.
# Only these tested consumers may accept this exact alias version.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    "vitest@5.0.4>vite": "1.2.0"
    "vite-plugin-checker@0.14.5>vite": "1.2.0"
    "@nuxt/devtools-kit@3.4.3>vite": "1.2.0"
    "@nuxt/devtools@3.4.3>vite": "1.2.0"
    "vite-hot-client@2.2.0>vite": "1.2.0"
    "vite-dev-rpc@2.0.0>vite": "1.2.0"
    "@vitejs/plugin-vue@6.0.10>vite": "1.2.0"
    "@vitejs/plugin-vue-jsx@5.1.6>vite": "1.2.0"
    "vite-plugin-vue-tracer@1.6.0>vite": "1.2.0"
    "vite-plugin-inspect@11.4.1>vite": "1.2.0"
    "@nuxt/vite-server@4.6.1>vite": "1.2.0"
